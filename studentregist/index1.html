<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

form{
    width:700px;
    padding:25px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.row{
    display:flex;
    gap:20px;
    margin-bottom:15px;
}

.col{
    width:50%;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:8px;
    border:1px solid #ccc;
    border-radius:5px;
}

.checkbox{
    margin:15px 0;
}

.checkbox input{
    width:auto;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:20px;
    border-color: rgb(0, 0, 0);
}

.buttons button{
    width:48%;
    padding:10px;
    border:none;
    border-radius:5px;
    color:rgb(14, 13, 13);
    font-size:16px;
    cursor:pointer;
    
}


</style>
</head>

<body>

<form>

    <h1>Registration Form</h1>
    <div style="background-color: aqua; height:200px; width:200px; border-radius:50%;">
        <img src="">
    </div>
</div>

<div class="row">

    <div class="col">
        <label>First Name</label>
        <input type="text" placeholder="Enter First Name">
    </div>

    <div class="col">
        <label>Last Name</label>
        <input type="text" placeholder="Enter Last Name">
    </div>

</div>

<div class="row">

    <div class="col">
        <label>Username</label>
        <input type="text" placeholder="Enter Username">
    </div>

    <div class="col">
        <label>Roll Number</label>
        <input type="number" placeholder="Enter Roll Number">
    </div>

</div>

<div class="row">

    <div class="col">
        <label>Phone Number</label>
        <input type="tel" placeholder="Enter Phone Number" name="phno" value="">
    </div>

    <div class="col">
        <label>WhatsApp Number</label>
        <input type="whtsspp" placeholder="Enter WhatsApp Number">
    </div>

</div>

<div class="checkbox">
    <input type="checkbox" id="same">
    <label for="same" style="display:inline;">
        WhatsApp Number is same as Phone Number
    </label>
</div>

<div class="row">

    <div class="col">
        <label>Account Number</label>
        <input type="number" placeholder="Enter Account Number">
    </div>

    <div class="col">
        <label>Password</label>
        <input type="password" placeholder="Enter Password" name="password">
    </div>

</div>

<div class="row">

    <div class="col">
        <label>Choose State</label>
        <select>
            <option>--Select State--</option>
            <option>Uttar Pradesh</option>
            <option>Uttarakhand</option>
            <option>Gujarat</option>
            <option>Maharashtra</option>
        </select>
    </div>

    <div class="col">
        <label>Choose City</label>
        <select>
            <option>--Select City--</option>
        </select>
    </div>

</div>

<div class="buttons">
    <button type="reset" class="reset" onclick="f1()">Button 1 </button>
    <button type="submit" id="b1">Button 2</button>
</div>
</form>
<script src="script.js"></script>
</body>
</html>
